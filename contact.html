<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanguard — Contact</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" class="logo" aria-label="Vanguard home">VANGUARD</a>
      <nav class="nav" aria-label="Primary">
        <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="/history.html">History</a></li>
          <li><a href="/works.html">Works</a></li>
          <li><a href="/artists.html">Artists</a></li>
          <li><a class="active" href="/contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <h1>Contact</h1>
          <p>We'd love to hear from you. Send a message and we'll reply soon.</p>
        </div>
        <div class="hero-art" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section">
      <div class="container grid-2">
        <form class="form" action="#" method="post">
          <div>
            <label class="label" for="name">Name</label>
            <input class="input" id="name" name="name" type="text" required placeholder="Your name" />
          </div>
          <div style="margin-top:12px;">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" required placeholder="you@example.com" />
          </div>
          <div style="margin-top:12px;">
            <label class="label" for="subject">Subject</label>
            <input class="input" id="subject" name="subject" type="text" placeholder="How can we help?" />
          </div>
          <div style="margin-top:12px;">
            <label class="label" for="message">Message</label>
            <textarea class="textarea" id="message" name="message" required placeholder="Write your message..."></textarea>
          </div>
          <div style="margin-top:16px;">
            <button class="btn primary" type="submit">Send</button>
          </div>
        </form>
        <div>
          <div class="card">
            <h3>Visit</h3>
            <p>Vanguard Museum, 123 Modern Ave, City</p>
          </div>
          <div class="card" style="margin-top:16px;">
            <h3>Hours</h3>
            <p>Tue–Sun, 10:00–18:00</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© 2025 Vanguard</div>
      <nav class="footer-nav" aria-label="Footer">
        <ul>
          <li><a href="/history.html">History</a></li>
          <li><a href="/works.html">Works</a></li>
          <li><a href="/artists.html">Artists</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </footer>
</body>
</html>
